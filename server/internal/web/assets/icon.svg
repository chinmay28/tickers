<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1f2933"/>

  <!-- Ticker tape: a strip of quotes running across the mark, tilted the way
       CountRoster's notepad is, so the two apps read as the same family. -->
  <g transform="rotate(-7 256 256)">
    <rect x="64" y="176" width="384" height="92" rx="18" fill="#f5f7f7"/>
    <rect x="64" y="176" width="384" height="92" rx="18" fill="none" stroke="#d4dedd" stroke-width="4"/>
    <g fill="#8fa3a1">
      <rect x="92"  y="204" width="52" height="14" rx="7"/>
      <rect x="92"  y="228" width="34" height="14" rx="7"/>
      <rect x="176" y="204" width="52" height="14" rx="7"/>
      <rect x="176" y="228" width="34" height="14" rx="7"/>
      <rect x="260" y="204" width="52" height="14" rx="7"/>
      <rect x="260" y="228" width="34" height="14" rx="7"/>
      <rect x="344" y="204" width="52" height="14" rx="7"/>
      <rect x="344" y="228" width="34" height="14" rx="7"/>
    </g>
  </g>

  <!-- Candlesticks rising over the tape: the price the tape is carrying. -->
  <g stroke-linecap="round">
    <!-- down candle -->
    <line x1="140" y1="300" x2="140" y2="404" stroke="#e2725b" stroke-width="12"/>
    <rect x="122" y="320" width="36" height="62" rx="8" fill="#e2725b"/>
    <!-- flat candle -->
    <line x1="222" y1="286" x2="222" y2="392" stroke="#4ECDC4" stroke-width="12"/>
    <rect x="204" y="300" width="36" height="70" rx="8" fill="#4ECDC4"/>
    <!-- tall candle -->
    <line x1="304" y1="256" x2="304" y2="386" stroke="#4ECDC4" stroke-width="12"/>
    <rect x="286" y="272" width="36" height="92" rx="8" fill="#4ECDC4"/>
    <!-- tallest candle -->
    <line x1="386" y1="228" x2="386" y2="378" stroke="#2f9e93" stroke-width="12"/>
    <rect x="368" y="244" width="36" height="112" rx="8" fill="#2f9e93"/>
  </g>
</svg>
